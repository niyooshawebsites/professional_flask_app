<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
        Flask App -{% block title%}{% endblock %}
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

    {#
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}" /> #}
</head>

<body style="height: 100vh" class="container-fluid d-flex flex-column justify-content-between align-items-between">
    <header>
        <nav class="navbar navbar-expand-lg px-5">
            <div class="container-fluid px-5">
                <a class="navbar-brand" href="/">Flask App</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNavDropdown">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="/">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                                aria-expanded="false">
                                Account
                            </a>
                            {% if user %}
                            <ul class="dropdown-menu">
                                <li><a class="dropdown-item" href="/auth/logout">logout</a></li>
                            </ul>
                            {% else %}
                            <ul class="dropdown-menu">
                                <li>
                                    <a class="dropdown-item" href="/auth/register">Register</a>
                                </li>
                                <li><a class="dropdown-item" href="/auth/login">Login</a></li>
                            </ul>
                            {% endif %}
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    {% block content %}
    {% endblock %}

    <footer>
        <p class="text-muted text-sm text-center">
            &copy; 2026. All Rights Reserved.
        </p>
    </footer>
</body>

</html>
